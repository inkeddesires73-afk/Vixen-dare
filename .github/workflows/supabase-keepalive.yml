name: Keep Supabase project active

on:
  schedule:
    # Ett litet läsanrop varje dag. Tiden är UTC och behöver inte vara exakt.
    - cron: '17 03 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Run database keepalive query
        run: |
          curl --fail --silent --show-error --get \
            'https://pxevuwvrmldscwlybyhz.supabase.co/rest/v1/vixen_keepalive' \
            --data-urlencode 'select=id' \
            --data-urlencode 'limit=1' \
            -H 'apikey: sb_publishable_-Lk-UQI7xep7MZH-jUrXmg_W5zjfNeS' \
            -H 'Authorization: Bearer sb_publishable_-Lk-UQI7xep7MZH-jUrXmg_W5zjfNeS' \
            -H 'Accept: application/json' > /dev/null
